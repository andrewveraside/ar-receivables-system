<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合同管理系统</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --line:#21262d; --line2:#30363d;
    --text:#e6edf3; --dim:#8b949e; --dim2:#6e7681; --blue:#1f6feb; --blue2:#388bfd;
    --green:#2ea043; --red:#f85149; --orange:#f0883e; --yellow:#d29922;
  }
  body{font-family:"Microsoft YaHei","PingFang SC",Inter,system-ui,sans-serif;background:var(--bg);
       color:var(--text);font-size:14px;line-height:1.5;padding:0 0 60px}
  header{position:sticky;top:0;z-index:30;background:rgba(13,17,23,.96);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:0 24px}
  .hd{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:18px;height:58px}
  .logo{font-size:16px;font-weight:650;display:flex;align-items:center;gap:9px}
  .logo i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
  nav{display:flex;gap:4px;margin-left:12px}
  nav button{background:none;border:none;color:var(--dim);padding:8px 14px;border-radius:7px;
             cursor:pointer;font-size:13.5px;font-family:inherit;transition:.15s}
  nav button:hover{background:var(--panel);color:var(--text)}
  nav button.on{background:#1f2b3d;color:var(--blue2);font-weight:600}
  .live{margin-left:auto;font-size:12px;color:var(--dim2);display:flex;align-items:center;gap:7px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .live.bad i{background:var(--red)}
  main{max-width:1400px;margin:0 auto;padding:22px 24px}
  .page{display:none}.page.on{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px 17px}
  .stat .t{font-size:12px;color:var(--dim)}
  .stat .v{font-size:24px;font-weight:640;margin-top:7px;font-variant-numeric:tabular-nums}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .panel>.ph{display:flex;align-items:center;gap:12px;padding:13px 17px;border-bottom:1px solid var(--line)}
  .panel>.ph h2{font-size:14px;font-weight:620}
  .panel>.ph .sp{flex:1}
  .panel>.pb{padding:17px}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px 18px}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld.wide{grid-column:1/-1}
  .fld label{font-size:12.5px;color:var(--dim);display:flex;gap:5px;align-items:center}
  .fld label b{color:var(--red);font-weight:400}
  input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:7px;
        padding:8px 11px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;
        width:100%;transition:.15s}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,111,235,.15)}
  input.err,select.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(248,81,73,.13)}
  input::placeholder,textarea::placeholder{color:#4b535c}
  textarea{resize:vertical;min-height:62px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:9px 20px;
       font-size:13.5px;font-family:inherit;cursor:pointer;font-weight:600;transition:.15s}
  .btn:hover{background:var(--blue2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line2);font-weight:400}
  .btn.ghost:hover{background:#262d36}
  .btn.danger{background:#3d1618;color:#ff7b72;border:1px solid #6e2a2c;font-weight:400}
  .btn.danger:hover{background:#5c1f22}
  .btn.sm{padding:5px 12px;font-size:12.5px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:600;color:var(--dim);font-size:12px;padding:10px 12px;
     border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #1a2028;vertical-align:middle}
  tbody tr:hover{background:#19202a}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;white-space:nowrap}
  .s-草签{background:rgba(139,148,158,.16);color:#9aa4af}
  .s-执行中{background:rgba(46,160,67,.16);color:#3fb950}
  .s-已完结{background:rgba(31,111,235,.16);color:#58a6ff}
  .s-已作废{background:rgba(248,81,73,.16);color:#ff7b72}
  .scroll{max-height:520px;overflow:auto}
  .scroll::-webkit-scrollbar{width:9px;height:9px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  .empty{text-align:center;color:var(--dim2);padding:46px 0;font-size:13px}
  .toast{position:fixed;right:24px;bottom:24px;background:#1f6f3d;color:#fff;padding:12px 20px;
         border-radius:9px;font-size:13.5px;opacity:0;transform:translateY(12px);
         transition:.25s;pointer-events:none;z-index:99;max-width:420px}
  .toast.on{opacity:1;transform:none}
  .toast.err{background:#8b2c2a}
  .hint{font-size:12px;color:var(--dim2);margin-top:5px}
  .errlist{background:#3d1618;border:1px solid #6e2a2c;color:#ffa198;border-radius:8px;
           padding:11px 15px;font-size:13px;margin-bottom:15px;display:none}
  .errlist.on{display:block}
  .errlist b{color:#ff7b72}
  .mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
  .kbd{background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;
       border-radius:5px;padding:1px 6px;font-size:11.5px;font-family:Consolas,monospace}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;font-size:13px}
  .kv dt{color:var(--dim)}
  @media(max-width:860px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="logo"><i></i>合同管理系统</div>
    <nav>
      <button data-tab="home" class="on">总览</button>
      <button data-tab="contract">合同录入</button>
      <button data-tab="customer">客户管理</button>
      <button data-tab="list">合同台账</button>
      <button data-tab="dashboard">应收看板</button>
    </nav>
    <div class="live" id="live"><i></i><span>连接中…</span></div>
  </div>
</header>

<main>
  <div class="errlist" id="errbox"></div>

  <!-- ============ 总览 ============ -->
  <section class="page on" id="page-home">
    <div class="cards" id="stats"></div>
    <div class="panel">
      <div class="ph"><h2>最近录入</h2><div class="sp"></div>
        <button class="btn ghost sm" id="btnSync">同步到看板</button>
        <button class="btn ghost sm" id="btnExport">导出全部数据(JSON)</button></div>
      <div class="pb" style="padding:0">
        <table><thead><tr>
          <th>合同号</th><th>客户</th><th class="num">金额</th><th>币种</th><th>签订日期</th><th>状态</th>
        </tr></thead><tbody id="latestBody"></tbody></table>
        <div class="empty" id="latestEmpty">还没有合同，去「合同录入」添加第一条</div>
      </div>
    </div>
  </section>

  <!-- ============ 合同录入 ============ -->
  <section class="page" id="page-contract">
    <div class="panel">
      <div class="ph"><h2 id="ctFormTitle">新增合同</h2><div class="sp"></div>
        <span class="hint">带 <b style="color:#f85149">*</b> 为必填，Ctrl+Enter 快速保存</span></div>
      <div class="pb">
        <form id="ctForm" autocomplete="off">
          <input type="hidden" id="ct_id">
          <div class="form">
            <div class="fld"><label>合同号 <b>*</b></label>
              <input id="contract_no" placeholder="如 HT-2026-001" maxlength="40"></div>
            <div class="fld"><label>客户 <b>*</b></label>
              <select id="customer_id"></select></div>
            <div class="fld"><label>签订日期 <b>*</b></label><input type="date" id="sign_date"></div>
            <div class="fld"><label>生效日期</label><input type="date" id="start_date"></div>
            <div class="fld"><label>到期日期</label><input type="date" id="end_date"></div>
            <div class="fld"><label>合同金额</label>
              <input id="amount" placeholder="0.00" inputmode="decimal"></div>
            <div class="fld"><label>币种</label><select id="currency"></select></div>
            <div class="fld"><label>付款条件</label>
              <input id="pay_term" placeholder="如 T/T 30天 / L/C 60天" maxlength="60"></div>
            <div class="fld"><label>贸易术语</label><select id="trade_term">
              <option value="">--</option><option>FOB</option><option>CIF</option>
              <option>CFR</option><option>EXW</option><option>DDP</option><option>FCA</option>
            </select></div>
            <div class="fld"><label>状态</label><select id="status"></select></div>
            <div class="fld"><label>业务员</label><select id="salesman"></select></div>
            <div class="fld wide"><label>备注</label>
              <textarea id="remark" maxlength="500" placeholder="合同要点、特殊条款等"></textarea></div>
          </div>
          <div class="row" style="margin-top:18px">
            <button type="submit" class="btn" id="btnSaveCt">保存合同</button>
            <button type="button" class="btn ghost" id="btnResetCt">清空</button>
            <span class="grow"></span>
            <span class="hint" id="ctTip"></span>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ 客户管理 ============ -->
  <section class="page" id="page-customer">
    <div class="panel">
      <div class="ph"><h2>新增 / 修改客户</h2><div class="sp"></div>
        <span class="hint">客户代码相同则覆盖更新</span></div>
      <div class="pb">
        <form id="cuForm" autocomplete="off">
          <div class="form">
            <div class="fld"><label>客户代码 <b>*</b></label>
              <input id="cu_code" placeholder="C001" maxlength="20" style="text-transform:uppercase"></div>
            <div class="fld"><label>客户名称 <b>*</b></label>
              <input id="cu_name" placeholder="HANSA TRADING GmbH" maxlength="200"></div>
            <div class="fld"><label>国家/地区</label><input id="cu_country" placeholder="德国" maxlength="40"></div>
            <div class="fld"><label>结算币种</label><select id="cu_currency"></select></div>
            <div class="fld"><label>账期(天)</label><input id="cu_pay_days" type="number" min="0" max="365" value="30"></div>
            <div class="fld"><label>信用额度</label><input id="cu_credit_limit" placeholder="0.00" inputmode="decimal"></div>
            <div class="fld"><label>业务员</label><select id="cu_salesman"></select></div>
            <div class="fld"><label>联系人</label><input id="cu_contact" placeholder="Hans Weber" maxlength="60"></div>
            <div class="fld"><label>邮箱</label><input id="cu_email" placeholder="a@b.com" maxlength="80"></div>
          </div>
          <div class="row" style="margin-top:18px">
            <button type="submit" class="btn">保存客户</button>
            <button type="button" class="btn ghost" id="btnResetCu">清空</button>
          </div>
        </form>
      </div>
    </div>
    <div class="panel">
      <div class="ph"><h2>客户列表</h2><div class="sp"></div><span class="hint" id="cuCount"></span></div>
      <div class="pb" style="padding:0">
        <div class="scroll"><table><thead><tr>
          <th>代码</th><th>名称</th><th>国家</th><th>币种</th><th class="num">账期</th>
          <th class="num">信用额度</th><th>业务员</th><th>联系人</th>
        </tr></thead><tbody id="cuBody"></tbody></table></div>
      </div>
    </div>
  </section>

  <!-- ============ 合同台账 ============ -->
  <section class="page" id="page-list">
    <div class="panel">
      <div class="ph"><h2>合同台账</h2><div class="sp"></div>
        <input id="q" placeholder="搜索合同号/客户/业务员" style="width:220px">
        <button class="btn ghost sm" id="btnSearch">搜索</button>
        <button class="btn sm" id="btnNew">+ 新增</button>
      </div>
      <div class="pb" style="padding:0">
        <div class="scroll"><table><thead><tr>
          <th>合同号</th><th>客户</th><th>签订</th><th>生效~到期</th>
          <th class="num">金额</th><th>币种</th><th>付款条件</th><th>业务员</th>
          <th>状态</th><th>操作</th>
        </tr></thead><tbody id="ctBody"></tbody></table></div>
        <div class="empty" id="ctEmpty">暂无合同记录</div>
      </div>
    </div>
  </section>
  <!-- ============ 应收看板 ============ -->
  <section class="page" id="page-dashboard">
    <div class="panel" style="margin-bottom:0">
      <div class="ph">
        <h2>应收看板</h2>
        <span class="hint" id="dashHint">数据来自合同库，点「刷新」重新生成</span>
        <div class="sp"></div>
        <button class="btn ghost sm" id="btnDashFresh">刷新看板</button>
        <button class="btn ghost sm" id="btnDashOpen">新窗口打开</button>
        <button class="btn ghost sm" id="btnDashDownload">下载 HTML</button>
      </div>
      <div class="pb" style="padding:0">
        <iframe id="dashFrame" style="width:100%;height:calc(100vh - 130px);border:0;background:#0d1117;display:block"></iframe>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const money = n => (n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
let toastTimer;
function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='toast'+(isErr?' err':''), 3200);
}
function showErrors(list){
  const b = $('errbox');
  if(!list || !list.length){ b.className='errlist'; b.innerHTML=''; return; }
  b.className='errlist on';
  b.innerHTML = '<b>保存失败：</b><br>' + list.map(e=>'· '+e).join('<br>');
  window.scrollTo({top:0,behavior:'smooth'});
}
function clearErrors(){ showErrors([]); }

async function api(path, opt){
  const res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opt||{}));
  let j;
  try{ j = await res.json(); }catch(e){ throw new Error('服务返回非 JSON，HTTP '+res.status); }
  if(!j.ok) throw new Error(j.error || '未知错误');
  return j;
}

/* ================= 状态 ================= */
const S = {customers:[], opts:null};

function fillSelect(sel, items, {value, label, blank}={}){
  sel.innerHTML='';
  if(blank !== undefined) sel.insertAdjacentHTML('beforeend', `<option value="">${blank}</option>`);
  items.forEach(it=>{
    const v = value ? value(it) : it, l = label ? label(it) : it;
    sel.insertAdjacentHTML('beforeend', `<option value="${v}">${l}</option>`);
  });
}

/* ================= 总览 ================= */
async function loadStats(){
  const d = await api('/api/stats');
  const bs = d.by_status || {};
  const cards = [
    {t:'客户总数', v:d.customers},
    {t:'合同总数', v:d.contracts},
    {t:'合同总额', v:money(d.total_amount)},
    {t:'执行中', v:bs['执行中']||0},
    {t:'已完结', v:bs['已完结']||0},
    {t:'草签/作废', v:(bs['草签']||0)+' / '+(bs['已作废']||0)},
  ];
  $('stats').innerHTML = cards.map(c=>
    `<div class="stat"><div class="t">${c.t}</div><div class="v">${c.v}</div></div>`).join('');
  $('latestBody').innerHTML = (d.latest||[]).map(r=>
    `<tr><td class="mono">${r.contract_no}</td><td>${r.customer_name}</td>
      <td class="num">${money(r.amount)}</td><td>${r.currency}</td>
      <td>${r.sign_date||''}</td><td><span class="tag s-${r.status}">${r.status}</span></td></tr>`).join('');
  $('latestEmpty').style.display = (d.latest||[]).length ? 'none' : 'block';
  S.opts = d.options;
  buildOptionSelects();
}

function buildOptionSelects(){
  const o = S.opts;
  if(!o) return;
  const keep = (el)=>{const v=el.value; return v;};
  const v1=keep($('currency'));
  fillSelect($('currency'), o.currencies);
  fillSelect($('status'), o.statuses);
  fillSelect($('salesman'), [{v:'',l:'--'}].map(x=>x.l), {});
  $('salesman').innerHTML = '<option value="">--</option>' + o.salesmen.map(s=>`<option>${s}</option>`).join('');
  $('trade_term').value = $('trade_term').value;
  const v2=keep($('cu_currency'));
  fillSelect($('cu_currency'), o.currencies);
  $('cu_salesman').innerHTML = '<option value="">--</option>' + o.salesmen.map(s=>`<option>${s}</option>`).join('');
  if(v1) $('currency').value=v1;
  if(v2) $('cu_currency').value=v2;
}

/* ================= 客户 ================= */
async function loadCustomers(){
  const d = await api('/api/customers');
  S.customers = d.data;
  const sel = $('customer_id');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- 请选择客户 --</option>';
  d.data.forEach(c=>{
    sel.insertAdjacentHTML('beforeend',
      `<option value="${c.id}">${c.code} ${c.name}</option>`);
  });
  if(cur) sel.value = cur;
  $('cuBody').innerHTML = d.data.map(c=>
    `<tr><td class="mono">${c.code}</td><td>${c.name}</td><td>${c.country||''}</td>
      <td>${c.currency||''}</td><td class="num">${c.pay_days||0}</td>
      <td class="num">${money(c.credit_limit)}</td><td>${c.salesman||''}</td><td>${c.contact||''}</td></tr>`).join('');
  $('cuCount').textContent = `共 ${d.data.length} 个客户`;
  if(!d.data.length) $('cuBody').innerHTML = '<tr><td colspan="8" class="empty">还没有客户</td></tr>';
}

/* ================= 合同台账 ================= */
async function loadContracts(q){
  const d = await api('/api/contracts' + (q?('?q='+encodeURIComponent(q)):''));
  const rows = d.data;
  $('ctEmpty').style.display = rows.length ? 'none' : 'block';
  $('ctBody').innerHTML = rows.map(r=>{
    const period = (r.start_date||'—') + ' ~ ' + (r.end_date||'—');
    return `<tr>
      <td class="mono">${r.contract_no}</td>
      <td>${r.customer_name}<div class="hint" style="margin:0">${r.customer_code} ${r.country||''}</div></td>
      <td>${r.sign_date||''}</td><td class="hint">${period}</td>
      <td class="num">${money(r.amount)}</td><td>${r.currency}</td>
      <td class="hint">${r.pay_term||''}${r.trade_term?' / '+r.trade_term:''}</td>
      <td>${r.salesman||''}</td>
      <td><span class="tag s-${r.status}">${r.status}</span></td>
      <td><button class="btn ghost sm" data-edit="${r.id}">编辑</button>
          <button class="btn danger sm" data-del="${r.id}">删除</button></td>
    </tr>`;
  }).join('');
}

async function editContract(id){
  const d = await api('/api/contracts');
  const r = d.data.find(x=>String(x.id)===String(id));
  if(!r){ toast('记录不存在', true); return; }
  $('ct_id').value = r.id;
  $('contract_no').value = r.contract_no;
  $('customer_id').value = r.customer_id;
  $('sign_date').value = r.sign_date||'';
  $('start_date').value = r.start_date||'';
  $('end_date').value = r.end_date||'';
  $('amount').value = r.amount;
  $('currency').value = r.currency;
  $('pay_term').value = r.pay_term||'';
  $('trade_term').value = r.trade_term||'';
  $('status').value = r.status;
  $('salesman').value = r.salesman||'';
  $('remark').value = r.remark||'';
  $('ctFormTitle').textContent = '编辑合同 · ' + r.contract_no;
  $('ctTip').textContent = '正在编辑已有记录，保存将覆盖';
  switchTab('contract');
}

async function delContract(id, no){
  if(!confirm(`确认删除合同 ${no}？此操作不可撤销。`)) return;
  await api('/api/contracts/'+id, {method:'DELETE'});
  toast('已删除 '+no);
  refreshAll();
}

/* ================= 表单提交 ================= */
$('ctForm').addEventListener('submit', async e=>{
  e.preventDefault();
  clearErrors();
  const btn = $('btnSaveCt');
  btn.disabled = true; btn.textContent = '保存中…';
  const payload = {
    id: $('ct_id').value || null,
    contract_no: $('contract_no').value.trim(),
    customer_id: $('customer_id').value,
    sign_date: $('sign_date').value,
    start_date: $('start_date').value,
    end_date: $('end_date').value,
    amount: $('amount').value,
    currency: $('currency').value,
    pay_term: $('pay_term').value.trim(),
    trade_term: $('trade_term').value,
    status: $('status').value,
    salesman: $('salesman').value,
    remark: $('remark').value.trim(),
  };
  const errs = [];
  if(!payload.contract_no) errs.push('合同号必填');
  if(!payload.customer_id) errs.push('必须选择客户');
  if(!payload.sign_date) errs.push('签订日期必填');
  if(payload.amount && isNaN(Number(String(payload.amount).replace(/,/g,''))))
    errs.push('合同金额必须是数字');
  if(payload.start_date && payload.end_date && payload.end_date < payload.start_date)
    errs.push('到期日期不能早于生效日期');
  if(errs.length){
    showErrors(errs);
    errs.forEach(m=>{});
    btn.disabled=false; btn.textContent='保存合同';
    return;
  }
  try{
    const r = await api('/api/contracts', {method:'POST', body: JSON.stringify(payload)});
    toast('保存成功：' + payload.contract_no);
    resetCtForm();
    refreshAll();
  }catch(err){
    showErrors([err.message]);
    toast('保存失败：'+err.message, true);
  }finally{
    btn.disabled=false; btn.textContent='保存合同';
  }
});

$('cuForm').addEventListener('submit', async e=>{
  e.preventDefault();
  clearErrors();
  const p = {
    code: $('cu_code').value.trim(),
    name: $('cu_name').value.trim(),
    country: $('cu_country').value.trim(),
    currency: $('cu_currency').value,
    pay_days: $('cu_pay_days').value,
    credit_limit: $('cu_credit_limit').value,
    salesman: $('cu_salesman').value,
    contact: $('cu_contact').value.trim(),
    email: $('cu_email').value.trim(),
  };
  const errs=[];
  if(!p.code) errs.push('客户代码必填');
  if(!p.name) errs.push('客户名称必填');
  if(errs.length){ showErrors(errs); return; }
  try{
    await api('/api/customers', {method:'POST', body: JSON.stringify(p)});
    toast('客户已保存：' + p.code);
    resetCuForm();
    refreshAll();
  }catch(err){ showErrors([err.message]); toast('保存失败：'+err.message, true); }
});

function resetCtForm(){
  $('ctForm').reset();
  $('ct_id').value='';
  $('status').value='执行中';
  $('sign_date').value = new Date().toISOString().slice(0,10);
  $('ctFormTitle').textContent='新增合同';
  $('ctTip').textContent='';
  clearErrors();
}
function resetCuForm(){
  $('cuForm').reset();
  $('cu_pay_days').value = 30;
  clearErrors();
}

/* ================= 交互绑定 ================= */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});
function switchTab(name){
  if(name==='dashboard'){
    // 先切页签让容器可见，再加载 iframe（可见后才有真实宽度）
    document.querySelectorAll('nav button').forEach(x=>
      x.classList.toggle('on', x.dataset.tab===name));
    document.querySelectorAll('.page').forEach(p=>
      p.classList.toggle('on', p.id==='page-'+name));
    loadDashboard();
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  document.querySelectorAll('nav button').forEach(x=>
    x.classList.toggle('on', x.dataset.tab===name));
  document.querySelectorAll('.page').forEach(p=>
    p.classList.toggle('on', p.id==='page-'+name));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= 应收看板（内嵌） ================= */
const DASH_URL = '/dashboard/view';
let dashLoaded = false;
function loadDashboard(force){
  if(dashLoaded && !force) return;
  const f = $('dashFrame');
  // 清空并延迟设 src，确保 iframe 已进入可见布局、拿到真实宽度后再加载
  f.removeAttribute('src');
  f.style.display = 'block';
  requestAnimationFrame(()=>{
    f.src = DASH_URL + '?t=' + Date.now();
  });
  dashLoaded = true;
}
$('btnDashFresh').addEventListener('click', async ()=>{
  const b = $('btnDashFresh');
  b.disabled = true; b.textContent = '生成中…';
  try{
    const r = await api('/api/rebuild-dashboard', {method:'POST', body:'{}'});
    toast('看板已刷新：' + r.msg);
    $('dashHint').textContent = '数据来自合同库 · ' + r.msg;
    loadDashboard(true);
  }catch(err){
    toast('刷新失败：' + err.message, true);
  }finally{
    b.disabled = false; b.textContent = '刷新看板';
  }
});
$('btnDashOpen').addEventListener('click', ()=>window.open(DASH_URL, '_blank'));
$('btnDashDownload').addEventListener('click', ()=>{ window.location = '/api/dashboard/download'; });
$('btnResetCt').addEventListener('click', resetCtForm);
$('btnResetCu').addEventListener('click', resetCuForm);
$('btnSearch').addEventListener('click', ()=>loadContracts($('q').value.trim()));
$('q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); loadContracts($('q').value.trim()); }});
$('btnNew').addEventListener('click', ()=>{ resetCtForm(); switchTab('contract'); });
$('btnExport').addEventListener('click', ()=>{ window.location = '/api/export.json'; });
$('btnSync').addEventListener('click', async ()=>{
  const btn = $('btnSync');
  btn.disabled = true; btn.textContent = '同步中…';
  try{
    const r = await api('/api/sync-dashboard', {method:'POST', body:'{}'});
    toast('已同步到看板：' + r.msg);
  }catch(err){
    toast('同步失败：' + err.message, true);
  }finally{
    btn.disabled = false; btn.textContent = '同步到看板';
  }
});

$('ctBody').addEventListener('click', e=>{
  const ed = e.target.closest('[data-edit]');
  const dl = e.target.closest('[data-del]');
  if(ed) editContract(ed.dataset.edit);
  if(dl){
    const tr = dl.closest('tr');
    const no = tr.querySelector('.mono').textContent.trim();
    delContract(dl.dataset.del, no);
  }
});

document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){
    const f = $('page-contract').classList.contains('on') ? $('ctForm') : null;
    if(f) f.requestSubmit();
  }
});

/* ================= 启动 ================= */
async function refreshAll(){
  try{
    await loadStats();
    await loadCustomers();
    await loadContracts($('q').value.trim());
    $('live').className='live';
    $('live').querySelector('span').textContent = '已连接 · 本地数据库';
  }catch(err){
    $('live').className='live bad';
    $('live').querySelector('span').textContent = '未连接：' + err.message;
    showErrors(['无法连接后端服务。请确认「启动合同系统.bat」窗口仍在运行。', err.message]);
  }
}

(async function boot(){
  resetCtForm();
  $('cu_pay_days').value = 30;
  await refreshAll();
  setInterval(async ()=>{
    try{ await api('/api/health'); }
    catch(e){
      $('live').className='live bad';
      $('live').querySelector('span').textContent='已断开';
    }
  }, 15000);
})();
</script>
